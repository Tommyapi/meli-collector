[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meli-collector"
version = "0.1.0"
description = "Session-aware Mercado Libre listing and product snapshot collector"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "scrapling>=0.5",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
meli-collector = "meli_collector.cli:main"
meli-collector-api = "meli_collector.api:main"

[tool.setuptools]
packages = ["meli_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
